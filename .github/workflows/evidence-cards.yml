# The evidence engine, run on demand. Read-only: it reads the market, prints
# the cards, and writes nothing anywhere.
name: evidence-cards

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Quanti giorni indietro guardare nella retrospettiva"
        default: "3"


permissions:
  contents: read

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cards
        run: python scripts/evidence_cards.py

      - name: Ranking
        run: python scripts/edge_ranking.py

      - name: Ultimi giorni
        run: python scripts/last_days.py --days ${{ inputs.days || 3 }}
