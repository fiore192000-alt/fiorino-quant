name: forecast-lab
on:
  workflow_dispatch:
    inputs:
      last:
        description: "Quante partite finali valutare"
        default: "100"
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/forecast_lab.py --last ${{ inputs.last || 100 }}
