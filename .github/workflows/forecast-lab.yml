name: forecast-lab
on:
  workflow_dispatch:
    inputs:
      last:
        description: "Quante partite finali valutare"
        default: "100"
permissions:
  contents: read
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11: le estensioni compilate di penaltyblog sono cpython-311.
          # Su 3.12 non caricano e il de-vig ripiega su moltiplicativo.
          python-version: "3.11"
      - name: Dipendenze (senza queste il de-vig ripiega su moltiplicativo)
        run: pip install -r requirements-lab.txt
      - run: python scripts/forecast_lab.py --last ${{ inputs.last || 100 }}
