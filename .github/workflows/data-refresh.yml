name: Data refresh

# fetch -> bronze -> rebuild -> audit -> publish version -> alert
#
# The repository is NOT the dataset. This workflow never commits bronze: it
# writes to the data store, publishes a version manifest, and alerts. Only the
# identity ledger — a small, human-authored decision log — is committed, for
# the same reason migrations are.
on:
  schedule:
    # 06:15 UTC: after openfootball's nightly update, before European kickoffs.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Fetch every tracked season instead of just the current one"
        type: boolean
        default: false
      sources:
        description: "Comma-separated sources"
        default: "openfootball,footballdata"

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

env:
  # Point this at the persistent data store. Anything outside the working tree
  # keeps the dataset out of git by construction rather than by discipline.
  FIORINO_DATA_ROOT: ${{ vars.FIORINO_DATA_ROOT || '/tmp/fiorino-data' }}
  LEDGER: configs/identity/ledger.json

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --quiet duckdb

      # Restore the previous bronze so today's fetch appends to history rather
      # than starting from nothing. Replace with your object store when the
      # dataset outgrows the cache (it is bounded to 10 GB).
      - name: Restore bronze
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.FIORINO_DATA_ROOT }}
          key: fiorino-data-${{ github.run_id }}
          restore-keys: fiorino-data-

      - name: Fetch into bronze
        run: |
          python -m fiorino.cli.refresh \
            --lake "$FIORINO_DATA_ROOT/bronze" \
            --sources "${{ inputs.sources || 'openfootball,footballdata' }}" \
            ${{ inputs.backfill && '--backfill' || '' }}

      # Rebuild, audit, and publish a version. `snapshot` exits non-zero when
      # the audit finds a blocking problem — most often a club name nobody has
      # adjudicated — and in that case NO version is published. The matches
      # using it are quarantined, never silently dropped.
      - name: Rebuild, audit and publish a dataset version
        id: snapshot
        run: |
          python -m fiorino.cli.main \
            --ledger "$LEDGER" \
            --code-version "${GITHUB_SHA::12}" \
            snapshot --note "scheduled refresh"

      - name: Audit report
        if: always()
        run: |
          mkdir -p docs/audit
          python -m fiorino.cli.main --ledger "$LEDGER" audit --out docs/audit/latest.md || true

      - name: Save bronze
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.FIORINO_DATA_ROOT }}
          key: fiorino-data-${{ github.run_id }}

      # The only thing committed: the identity decision log and the audit
      # summary. Kilobytes, human-readable, reviewable in a diff.
      - name: Commit identity ledger and audit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" docs/audit/latest.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no identity or audit changes"
          else
            git commit -m "chore(identity): refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-manifests
          path: ${{ env.FIORINO_DATA_ROOT }}/manifests/
          if-no-files-found: warn

      - name: Alert on a failed refresh
        if: failure()
        run: |
          echo "::error::Refresh did not publish a dataset version."
          echo "::error::Most likely cause: new club names awaiting adjudication."
          echo "::error::Their matches are quarantined, not dropped. See docs/audit/latest.md"
