# Where the wall stands. Read-only: probes endpoints, writes nothing, commits
# nothing, and has no write permission at all.
name: diagnose-source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        run: python scripts/diagnose_source.py
