# The odds recorder.
#
# Needs no token and no account: football-data.co.uk publishes fixtures.csv for
# download. The only thing between this file and a running collection is being
# on the default branch, because GitHub lists workflow_dispatch and fires
# schedule only for workflows present there.
name: record-odds

on:
  # SCHEDULER DISATTIVATO FINCHE' IL PRIMO PAYLOAD REALE NON E' STATO VERIFICATO.
  #
  # Il merge sul branch di default e' cio' che rende un cron attivo, quindi
  # mergiare con lo schedule acceso significherebbe far partire la raccolta
  # PRIMA della verifica, che e' l'ordine opposto a quello deciso. Restano
  # quindi solo le esecuzioni manuali.
  #
  # Per accendere, dopo che --verify ha mostrato un payload reale corretto e la
  # prima osservazione e' finita nel layer TIMESTAMPED: togliere il commento
  # alle due righe qui sotto.
  #
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      verify:
        description: "Report what the file contains, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: record-odds
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll
        run: |
          if [ "${{ inputs.verify }}" = "true" ]; then
            python scripts/record_odds.py --verify
          else
            python scripts/record_odds.py
          fi

      - name: Commit the observation
        if: ${{ inputs.verify != true }}
        run: |
          if [ -z "$(git status --porcelain archive/)" ]; then
            echo "niente da committare"
            exit 0
          fi
          git config user.name  "fiorino-odds-recorder"
          git config user.email "noreply@github.com"
          git add archive/
          git commit -m "odds: poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "push fallito dopo 5 tentativi"; exit 1
